[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "kwconf-python-accel"
version = "0.0.0"
requires-python = ">=3.10"
description = "Optional Stable-ABI Rust accelerator for Python kwconf"

[tool.maturin]
bindings = "pyo3"
module-name = "_kwconf_rust"
features = ["python-extension"]
strip = true
