name: PurePyCI

on:
  push:
    # Restricting push triggers to the default branch avoids running
    # validation twice (push + pull_request events) for every push to a PR
    # branch. Feature branches are covered by pull_request; release refs are
    # handled by release.yml.
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_job:
    ##
    # Run quick linting and typing checks.
    # To disable all linting add "linter=false" to the xcookie config.
    # To disable type checks add "notypes" to the xcookie tags.
    ##
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Set up Python 3.14 for linting
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.14'
    - name: Install dependencies
      run: |-
        python -m pip install pip uv -U
        python -m uv pip install flake8
    - name: Lint with flake8
      run: |-
        # stop the build if there are Python syntax errors or undefined names
        flake8 ./kwconf --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Typecheck
      run: |-
        python -m pip install ty
        pip install --prefer-binary -e ".[tests]"
        ty check ./kwconf
  build_and_test_sdist:
    ##
    # Build the pure python package from source and test it in the
    # same environment.
    ##
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Set up Python 3.14
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.14'
    - name: Upgrade pip
      run: |-
        python -m pip install pip uv -U
        python -m pip install --prefer-binary -e ".[tests]"
    - name: Build sdist
      shell: bash
      run: |-
        python -m pip install pip uv -U
        python -m uv pip install setuptools>=77 wheel build twine
        python -m build --sdist --outdir wheelhouse
        python -m twine check ./wheelhouse/kwconf*.tar.gz
    - name: Install sdist
      run: |-
        ls -al wheelhouse
        python -m pip install --prefer-binary wheelhouse/kwconf*.tar.gz -v
    - name: Test minimal loose sdist
      env: {}
      run: |-
        pwd
        ls -al
        # Run in a sandboxed directory
        WORKSPACE_DNAME="testsrcdir_minimal_${CI_PYTHON_VERSION}_${GITHUB_RUN_ID}_${RUNNER_OS}"
        mkdir -p $WORKSPACE_DNAME
        cd $WORKSPACE_DNAME
        # Run the tests
        # Get path to installed package
        MOD_DPATH=$(python -c "import kwconf, os; print(os.path.dirname(kwconf.__file__))")
        echo "MOD_DPATH = $MOD_DPATH"
        MOD_NAME=kwconf
        python -m pytest --verbose --cov=kwconf $MOD_DPATH ../tests
        cd ..
    - name: Test full loose sdist
      env: {}
      run: |-
        pwd
        ls -al
        true
        # Run in a sandboxed directory
        WORKSPACE_DNAME="testsrcdir_full_${CI_PYTHON_VERSION}_${GITHUB_RUN_ID}_${RUNNER_OS}"
        mkdir -p $WORKSPACE_DNAME
        cd $WORKSPACE_DNAME
        # Run the tests
        # Get path to installed package
        MOD_DPATH=$(python -c "import kwconf, os; print(os.path.dirname(kwconf.__file__))")
        echo "MOD_DPATH = $MOD_DPATH"
        MOD_NAME=kwconf
        python -m pytest --verbose --cov=kwconf $MOD_DPATH ../tests
        cd ..
    - uses: actions/upload-artifact@v6.0.0
      name: Upload sdist artifact
      with:
        name: sdist_wheels
        path: ./wheelhouse/kwconf*.tar.gz
  build_purepy_wheels:
    ##
    # Build the pure-python wheels independently on a per-platform basis.
    # These will be tested later in the test_purepy_wheels step.
    ##
    name: Build wheel ${{ matrix.python-version }} on ${{ matrix.os }}, arch=${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        python-version:
        - '3.14'
        arch:
        - auto
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build pure wheel
      shell: bash
      run: |-
        python -m pip install pip uv -U
        python -m uv pip install setuptools>=77 wheel build twine
        python -m build --wheel --outdir wheelhouse
        python -m twine check ./wheelhouse/kwconf*.whl
    - name: Show built files
      shell: bash
      run: ls -la wheelhouse
    - uses: actions/upload-artifact@v6.0.0
      name: Upload wheels artifact
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: ./wheelhouse/kwconf*.whl
  test_purepy_wheels:
    ##
    # Download and test the pure-python wheels that were built in the
    # build_purepy_wheels step in this independent environment.
    ##
    name: ${{ matrix.python-version }} on ${{ matrix.os }}, arch=${{ matrix.arch }} with ${{ matrix.install-extras }}
