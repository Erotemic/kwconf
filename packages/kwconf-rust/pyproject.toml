[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "kwconf-rust"
version = "0.12.1"
description = "Optional Stable-ABI Rust accelerator for kwconf"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["kwconf==0.12.1"]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Kitware Inc.", email = "kitware@kitware.com" },
  { name = "Jon Crall", email = "jon.crall@kitware.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
urls.Homepage = "https://github.com/Erotemic/kwconf"
urls.Repository = "https://github.com/Erotemic/kwconf"
urls.Issues = "https://github.com/Erotemic/kwconf/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
bindings = "pyo3"
module-name = "_kwconf_rust"
features = ["python-extension"]
strip = true

# One abi3 build per platform is sufficient for all supported CPython versions.
[tool.cibuildwheel]
build = "cp310-*"
skip = "pp*"
archs = ["auto64"]

# Linux wheels build inside manylinux / musllinux containers, not directly on
# the GitHub runner.  Install Rust inside that container so maturin never has
# to fall back to its best-effort puccinialin bootstrap.
[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.xcookie]
tags = ["binpy"]
mod_name = "_kwconf_rust"
rel_mod_parent_dpath = "."
typed = false
deploy_pypi = true
